kind = "web"
previewPath = "/"
title = "MRPL Confidential Industrial Workcell"
description = "A polished prototype for confidential industrial task execution, showing scoped evidence, bounded local-AI analysis, exception review, verification, release, and audit history."
version = "1.0.0"
id = "artifacts/industrial-workcell"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21773

[services.development]
run = "pnpm --filter @workspace/industrial-workcell run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/industrial-workcell", "run", "build" ]
serve = "static"
publicDir = "artifacts/industrial-workcell/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21773"
BASE_PATH = "/"
